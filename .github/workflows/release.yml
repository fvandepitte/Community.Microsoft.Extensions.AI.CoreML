name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  derive-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "Tag must start with 'v' and include a version (example: v1.2.3)." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  package:
    needs: derive-version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.derive-version.outputs.version }}

  publish:
    needs:
      - derive-version
      - package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is required." >&2
            exit 1
          fi

          shopt -s nullglob

          for pkg in artifacts/nuget/*.nupkg; do
            if [[ "$pkg" == *.snupkg ]]; then
              continue
            fi
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

          for sym in artifacts/nuget/*.snupkg; do
            dotnet nuget push "$sym" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/nuget/*
